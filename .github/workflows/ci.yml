name: CI

# The PR gate: the same `ci:build` command developers run locally. Make this
# a required status check on main so nothing merges past it.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run ci:build
      # Real-browser tests: tokens, focus rings, touch targets and axe. jsdom cannot check these.
      - run: bunx playwright install --with-deps chromium
      - run: bun run test:browser
